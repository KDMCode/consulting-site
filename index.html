<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kyle Miller</title>
    <meta name="description" content="Kyle Miller is an owner and investor in small and medium-sized businesses in varying industries, based in Charlotte, NC.">
    <link rel="canonical" href="https://kdmhq.com/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kyle Miller">
    <meta property="og:description" content="Kyle Miller is an owner and investor in small and medium-sized businesses in varying industries, based in Charlotte, NC.">
    <meta property="og:image" content="https://kdmhq.com/kyle-miller.jpg">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
      body.home { margin: 0; min-height: 100vh; background: var(--rail); display: flex; align-items: center; justify-content: center; }
      .home main { width: 100%; max-width: 40rem; padding: 3rem 1.5rem; box-sizing: border-box; text-align: center; color: var(--rail-ink); }
      .home img { width: 15rem; max-width: 70%; height: auto; border-radius: 6px; border: 1px solid var(--rail-line); }
      .home h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.5rem, 7vw, 3.75rem); margin: 1.5rem 0 0.25rem; }
      .home .where { color: var(--rail-muted); font-size: 1.05rem; margin: 0 0 1.25rem; }
      .home .intro { font-size: clamp(1.15rem, 2.6vw, 1.4rem); line-height: 1.5; margin: 0 auto 2rem; max-width: 32rem; }
      .home nav { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      .home nav a { display: inline-block; min-width: 8rem; padding: 0.75rem 1.25rem; border: 1px solid var(--rail-muted); border-radius: 999px; color: var(--rail-ink); text-decoration: none; font-weight: 600; }
      .home nav a:hover, .home nav a:focus-visible { background: var(--paper); color: var(--rail); }
    </style>
  </head>
  <body class="home">
    <main>
      <img src="kyle-miller.jpg" alt="Kyle Miller" width="675" height="825" fetchpriority="high">
      <h1>Kyle Miller</h1>
      <p class="where">Charlotte, NC</p>
      <p class="intro">I am an owner and investor in small and medium-sized businesses in varying industries.</p>
      <nav aria-label="Primary">
        <a href="consulting/">Consulting</a>
        <a href="contact/">Contact</a>
        <a href="https://www.linkedin.com/in/kylemillerclt">LinkedIn</a>
      </nav>
    </main>
  </body>
</html>
